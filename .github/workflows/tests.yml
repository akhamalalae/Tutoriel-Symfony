name: Tests

on:
  push:
  pull_request:

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: search
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:7.17.13
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd="curl -f http://localhost:9200/_cluster/health || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: test
      APP_SECRET: ci-secret-key-for-tests-only
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/search?serverVersion=8.0.32&charset=utf8mb4
      ELASTICSEARCH_URL: http://127.0.0.1:9200/
      MAILER_DSN: null://null
      ENQUEUE_DSN: null://
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
      MERCURE_URL: https://example.com/.well-known/mercure
      MERCURE_PUBLIC_URL: https://example.com/.well-known/mercure
      MERCURE_JWT_SECRET: test-mercure-jwt-secret
      SYMFONY_DEPRECATIONS_HELPER: disabled

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, zip, bcmath, sockets
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare application
        run: |
          cp .env.test .env
          mkdir -p public/build
          echo '{"entrypoints":{"app":{"js":[],"css":[]}}}' > public/build/entrypoints.json
          echo '{}' > public/build/manifest.json
          php bin/console doctrine:database:create --if-not-exists --no-interaction
          php bin/console doctrine:migrations:migrate --no-interaction

      - name: Run PHPUnit
        run: php bin/phpunit
